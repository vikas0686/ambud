name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    # internal/controlplane/store, internal/agent, and internal/cpclient
    # all have tests that run against a real Postgres (see those
    # packages' own test files for why — a fake can't validate SQL
    # constraints). This service container is that Postgres; the DSN
    # below matches AMBUD_TEST_DATABASE_URL's default in those tests,
    # made explicit here so CI doesn't depend on that default staying
    # in sync with this file by accident.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ambud
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: ambud_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ambud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AMBUD_TEST_DATABASE_URL: postgres://ambud:devpassword@localhost:15432/ambud_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt -s formatting
        run: |
          unformatted="$(gofmt -l -s .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt -s formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          verify: true

      - name: go build
        run: go build ./...

      - name: go test (race detector + coverage)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build
